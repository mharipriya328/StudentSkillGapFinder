<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Skill Gap Finder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Skill Gap Finder</h1>

        <p class="subtitle">
            Find the skills you need for your dream career
        </p>

        <div class="card">

            <label for="career">Select Your Career</label>

            <select id="career">
                <option value="data_analyst">Data Analyst</option>
                <option value="data_scientist">Data Scientist</option>
                <option value="web_developer">Web Developer</option>
                <option value="cloud_engineer">Cloud Engineer</option>
            </select>


            <label>Your Current Skills</label>

            <div class="skills">

                <label>
                    <input type="checkbox" value="python">
                    Python
                </label>

                <label>
                    <input type="checkbox" value="sql">
                    SQL
                </label>

                <label>
                    <input type="checkbox" value="excel">
                    Excel
                </label>

                <label>
                    <input type="checkbox" value="powerbi">
                    Power BI
                </label>

                <label>
                    <input type="checkbox" value="statistics">
                    Statistics
                </label>

                <label>
                    <input type="checkbox" value="java">
                    Java
                </label>

            </div>


            <button onclick="findSkillGap()">
                FIND MY SKILL GAP
            </button>

        </div>


        <div id="result" class="result">

            <h2>📊 Your Result</h2>

            <p id="careerResult"></p>

            <h3>Missing Skills</h3>

            <ul id="missingSkills"></ul>

            <h3>📚 Learning Roadmap</h3>

            <ol id="roadmap"></ol>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
